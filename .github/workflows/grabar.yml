name: Grabar directos (diario)

# Graba cada tarde, sin depender de nadie, a los streamers de GTA VI que más suelen dar juego.
# Si alguno no está en directo, su trabajo falla solo y el resto sigue.
on:
  schedule:
    - cron: "40 17 * * *"   # 18:40 hora de España (invierno)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  grabar:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    strategy:
      fail-fast: false
      matrix:
        canal: [illojuan, rubius, auronplay, peereira7, ishowspeed, kaicenat]
    env:
      TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
      TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
      CANAL: ${{ matrix.canal }}
      MINUTOS: "120"
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar ffmpeg y fuentes
        timeout-minutes: 10
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-inter

      - name: Instalar dependencias
        run: pip install -q -r requirements.txt

      - name: Caché del modelo de subtítulos
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-small-v1

      - name: Grabar y cortar
        run: python main.py directo

      - name: Publicar los cortes como release
        if: always()
        run: |
          shopt -s nullglob
          for v in bandeja/*.mp4; do
            tag="$(basename "$v" .mp4)"
            gh release create "$tag" "$v" "bandeja/$tag.json" \
              --title "$tag" --notes "Pendiente de revisión"
          done
